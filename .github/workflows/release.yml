name: Release (Android)

on:
  push:
    tags: ['v*']

permissions:
  contents: write


concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm test       # 发版前再过一道门
      - name: 从 tag 注入版本号
        run: |
          VER=${GITHUB_REF_NAME#v}
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]] || {
            echo "invalid tag: $GITHUB_REF_NAME (expect v<semver>)"; exit 1;
          }
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            // android.versionCode 必须随版本递增，否则新 APK 装不上旧版本（系统按数值判新旧）
            const [major, minor, patch] = ver.split("-")[0].split("+")[0].split(".").map(Number);
            const versionCode = major * 10000 + minor * 100 + patch;
            for (const path of ["package.json", "app.json"]) {
              const json = JSON.parse(fs.readFileSync(path, "utf8"));
              if (path === "app.json") {
                json.expo.version = ver;
                json.expo.android = { ...(json.expo.android || {}), versionCode };
              } else {
                json.version = ver;
              }
              fs.writeFileSync(path, JSON.stringify(json, null, 2) + "\n");
            }
            console.log(`version=${ver} versionCode=${versionCode}`);
          ' "$VER"
          echo "injected version $VER into package.json and app.json"

      - run: pnpm expo prebuild --platform android --no-install
      - name: Build APK
        working-directory: android
        env:
          NODE_PATH: ${{ github.workspace }}/node_modules/.pnpm/node_modules
        run: ./gradlew assembleRelease --no-daemon

      - name: 产物整理 + 校验和
        run: |
          VER=${GITHUB_REF_NAME#v}
          cp android/app/build/outputs/apk/release/app-release.apk TaleCast-v${VER}-android.apk
          sha256sum TaleCast-v${VER}-android.apk > SHA256SUMS

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            TaleCast-v*-android.apk SHA256SUMS \
            --title "TaleCast $GITHUB_REF_NAME" --generate-notes
