name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 依赖健康门（issue #83）：peer 缺失 / SDK 版本漂移 / 重复原生模块即红
      - run: npx expo-doctor
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
